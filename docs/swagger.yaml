info:
  contact: {}
  description: API server for booking system.
  title: PhotoStudio API
  version: "1.0"
paths:
  /admin/ads:
    get:
      consumes:
      - application/json
      description: Get a list of ads for the platform
      parameters:
      - description: Ad placement
        in: query
        name: placement
        type: string
      - description: Show active only
        in: query
        name: active_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get ads
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Create a new ad on the platform
      parameters:
      - description: Ad fields
        in: body
        name: ad
        required: true
        schema:
          $ref: '#/definitions/admin.Ad'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create ad
      tags:
      - Admin
  /admin/ads/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an ad by ID
      parameters:
      - description: Ad ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete ad
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Update an existing ad
      parameters:
      - description: Ad ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updating fields
        in: body
        name: ad
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update ad
      tags:
      - Admin
  /admin/analytics:
    get:
      consumes:
      - application/json
      description: Get analytical data for the platform
      parameters:
      - default: 30
        description: Days back
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get platform analytics
      tags:
      - Admin
  /admin/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate as an administrator
      parameters:
      - description: Admin credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/admin.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Admin login
      tags:
      - Admin
  /admin/auth/me:
    get:
      consumes:
      - application/json
      description: Get info about the currently logged in admin
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current admin
      tags:
      - Admin
  /admin/leads:
    get:
      description: Админский эндпоинт для просмотра заявок с возможностью фильтрации
        по статусу.
      parameters:
      - description: Фильтр по статусу (new, contacted, qualified, converted, rejected)
        in: query
        name: status
        type: string
      - description: 'Лимит (дефолт: 50)'
        in: query
        name: limit
        type: integer
      - description: Отступ
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список заявок
          schema:
            $ref: '#/definitions/lead.swaggerLeadListResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список лидов
      tags:
      - Admin Leads
  /admin/leads/{id}:
    get:
      description: Админский эндпоинт для получения заявки по её идентификатору.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные заявки
          schema:
            $ref: '#/definitions/lead.swaggerLeadResponse'
        "400":
          description: Некорректный ID
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить лид
      tags:
      - Admin Leads
